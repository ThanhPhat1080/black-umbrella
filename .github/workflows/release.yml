name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: client/go.sum

      - name: Test client
        working-directory: client
        env:
          GOTOOLCHAIN: local
        run: go test ./...

      - name: Build binaries
        env:
          GOTOOLCHAIN: local
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          scripts/build.sh https://umbrella.black-umbrella.workers.dev "$VERSION"
          cd dist && sha256sum umbrella-* > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          gh release create "$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "Umbrella $VERSION" \
            --notes-file .github/release-notes.md
