name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: client/go.sum

      - name: Test client
        working-directory: client
        env:
          GOTOOLCHAIN: local
        run: go test ./...

      - name: Build binaries
        env:
          GOTOOLCHAIN: local
        run: |
          scripts/build.sh https://umbrella.black-umbrella.workers.dev
          cd dist && sha256sum umbrella-* > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Umbrella $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
